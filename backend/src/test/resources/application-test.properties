# H2 in-memory database for integration tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT configuration for testing (512 bits = 64 bytes minimum for HS512)
jwt.secret=testSecretKeyForTestingPurposesOnlyNotForProductionUseAtAllMustBeLongEnoughForHS512Algorithm512BitsRequired
jwt.expiration=86400000

# Security debug logging
logging.level.org.springframework.security=DEBUG
