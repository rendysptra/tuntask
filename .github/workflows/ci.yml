# CI tuntask: test backend dan frontend.
# Dipanggil oleh pipeline.yml (workflow_call). workflow_dispatch disediakan agar
# test bisa dijalankan manual pada branch mana pun.

name: CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Siapkan JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Maven verify
        run: ./mvnw -B verify

      - name: Unggah laporan test jika gagal
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore

  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Siapkan Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Flag yang sama dengan frontend/Dockerfile supaya hasilnya konsisten
      - name: Install dependency
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test

      - name: Build
        run: npm run build