name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_call:   # dipanggil oleh cd.yml saat push

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      # Asumsi Node.js. Ganti sesuai stack Anda (Python, Go, Java, dll).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test