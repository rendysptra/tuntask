name: CD

on:
  push:
    branches: [dev, main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false   # jangan batalkan deploy yang sedang berjalan

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
  REGISTRY: asia-southeast2-docker.pkg.dev   # Jakarta, ganti jika perlu

jobs:
  # Gerbang: test harus lolos dulu (memanggil ci.yml)
  ci:
    uses: ./.github/workflows/ci.yml

  # Build dan push: image ke Artifact Registry, tag = commit SHA
  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Deploy: SSH ke VM, pull image, health check
  #   dev  -> environment "staging"
  #   main -> environment "production"
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_PREFIX: ${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}
          HEALTH_URL: ${{ vars.HEALTH_URL }}   # contoh: http://localhost:8080/health
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: IMAGE_TAG,IMAGE_PREFIX,HEALTH_URL
          script_stop: true
          script: |
            cd /opt/app

            PREV_TAG=$(cat .current_tag 2>/dev/null || true)
            export IMAGE_TAG IMAGE_PREFIX

            echo ">> Pull image tag $IMAGE_TAG"
            docker compose pull
            docker compose up -d --remove-orphans

            echo ">> Health check $HEALTH_URL"
            for i in $(seq 1 15); do
              if curl -fsS "$HEALTH_URL" > /dev/null; then
                echo ">> Sehat. Deploy berhasil."
                echo "$IMAGE_TAG" > .current_tag
                docker image prune -f > /dev/null
                exit 0
              fi
              sleep 4
            done

            echo ">> Health check gagal."
            if [ -n "$PREV_TAG" ]; then
              echo ">> Rollback ke $PREV_TAG"
              IMAGE_TAG=$PREV_TAG docker compose up -d
            fi
            exit 1