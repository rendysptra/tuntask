services:
  postgres:
    image: postgres:16-alpine
    container_name: tuntask-postgres-${ENV_NAME}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  backend:
    image: ${IMAGE_PREFIX}/backend:${IMAGE_TAG}
    container_name: backend-${ENV_NAME}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal_net
      - tuntask-net

  frontend:
    image: ${IMAGE_PREFIX}/frontend:${IMAGE_TAG}
    container_name: frontend-${ENV_NAME}
    restart: unless-stopped
    environment:
      VITE_API_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tuntask-net

volumes:
  postgres_data:

networks:
  internal_net:
    driver: bridge
  tuntask-net:
    external: true